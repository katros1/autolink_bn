name: Deploy AutoLink bn

on:
  push:
    branches:
      - develop

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/autolink-bn:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/autolink-bn:latest

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo docker stop autolink_bn || true
            sudo docker rm autolink_bn || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/autolink-bn:latest
            cd com-workspace/autolink_bn
            sudo docker-compose down
            
            echo 'Cleaning up unused Docker resources...'
            sudo docker volume prune --force && sudo docker system prune -f

            echo 'Building and starting services...'
            sudo docker compose up -d --force-recreate
            
            echo 'Deployment completed successfully!'
            
